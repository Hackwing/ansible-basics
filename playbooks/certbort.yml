---
- name: Install Certbot and NGINX plugin
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Certbot
      apt:
        name: certbot
        state: present

    - name: Install python3-certbot-nginx plugin
      apt:
        name: python3-certbot-nginx
        state: present
