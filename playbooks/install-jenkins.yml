---
- name: Install Jenkins on Ubuntu
  hosts: all
  become: true

  vars:
    jenkins_repo_url: https://pkg.jenkins.io/debian-stable
    jenkins_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key

  tasks:

    - name: Install required packages
      apt:
        name:
          - openjdk-17-jdk
          - gnupg2
          - curl
        state: present
        update_cache: true

    - name: Add Jenkins GPG key
      ansible.builtin.apt_key:
        url: "{{ jenkins_key_url }}"
        state: present

    - name: Add Jenkins repository
      ansible.builtin.apt_repository:
        repo: "deb {{ jenkins_repo_url }} binary/"
        state: present
        filename: jenkins

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: latest

    - name: Enable and start Jenkins service
      systemd:
        name: jenkins
        enabled: true
        state: started

    - name: Wait for Jenkins to come up (port 8080)
      wait_for:
        port: 8080
        delay: 10
        timeout: 60

    - name: Display Jenkins initial admin password
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_admin_pass
      changed_when: false

    - name: Print Jenkins initial admin password
      debug:
        msg: "Jenkins initial admin password: {{ jenkins_admin_pass.stdout }}"
